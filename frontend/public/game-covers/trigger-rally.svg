<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="rally-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="rally-dirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="450" fill="url(#rally-sky)"/>

  <!-- 3D Mountains in Background -->
  <polygon points="0,300 160,180 320,300" fill="#312e81" opacity="0.6"/>
  <polygon points="240,300 440,150 640,300" fill="#1e1b4b" opacity="0.8"/>
  <polygon points="520,300 680,190 800,300" fill="#312e81" opacity="0.5"/>

  <!-- 3D Curved Dirt Track -->
  <path d="M 0 450 L 0 350 Q 200 360 400 290 T 800 240 L 800 450 Z" fill="url(#rally-dirt)"/>
  <path d="M 0 350 Q 200 360 400 290 T 800 240" fill="none" stroke="#d97706" stroke-width="8"/>

  <!-- 3D Rally Car Drifting -->
  <g transform="translate(420, 270) rotate(-8) scale(1.4)">
    <!-- Dust Cloud -->
    <ellipse cx="-45" cy="15" rx="35" ry="15" fill="#fef3c7" opacity="0.4"/>
    <ellipse cx="-25" cy="20" rx="25" ry="10" fill="#fde68a" opacity="0.5"/>

    <!-- Wheels -->
    <circle cx="-32" cy="14" r="14" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <circle cx="34" cy="14" r="14" fill="#0f172a" stroke="#334155" stroke-width="2"/>

    <!-- Rally Car Body (Subaru Blue & Yellow livery) -->
    <polygon points="-44,10 44,10 38,-4 20,-4 10,-18 -22,-18 -32,-4 -44,10" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
    <!-- Yellow Racing Stripe -->
    <polygon points="-44,4 44,4 42,-1 -42,-1" fill="#facc15"/>
    <!-- Windows -->
    <polygon points="8,-5 18,-5 10,-15 -4,-15" fill="#93c5fd" opacity="0.8"/>
    <polygon points="-7,-5 -18,-5 -18,-15 -7,-15" fill="#93c5fd" opacity="0.8"/>
    <!-- Rear Spoiler -->
    <rect x="-42" y="-12" width="6" height="10" fill="#1e293b"/>
    <rect x="-46" y="-15" width="14" height="4" fill="#facc15"/>
    <!-- Headlight Beam -->
    <circle cx="43" cy="2" r="4" fill="#fef08a"/>
    <polygon points="46,0 120,-12 120,16 46,6" fill="#fef08a" opacity="0.3"/>
  </g>

  <!-- Title & Typography -->
  <g transform="translate(400, 75)">
    <rect x="-80" y="-30" width="160" height="24" rx="12" fill="#facc15" fill-opacity="0.15" stroke="#facc15" stroke-width="1"/>
    <text x="0" y="-14" fill="#facc15" font-family="system-ui, sans-serif" font-weight="800" font-size="11" text-anchor="middle" letter-spacing="2">3D WEBGL RALLY</text>
    <text x="0" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="46" text-anchor="middle" letter-spacing="-1">
      TRIGGER <tspan fill="#facc15">RALLY</tspan>
    </text>
    <text x="0" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="600" font-size="13" text-anchor="middle">
      CodeArtemis · Real-Time 3D Physics Rally Racing Online
    </text>
  </g>
</svg>
