<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="fire-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7700" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#e11d48" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="#09090b"/>

  <!-- Campfire Radial Ambient Light -->
  <circle cx="400" cy="270" r="220" fill="url(#fire-glow)"/>

  <!-- Pixelated Campfire -->
  <g transform="translate(400, 270)">
    <!-- Logs -->
    <line x1="-35" y1="20" x2="35" y2="30" stroke="#78350f" stroke-width="8" stroke-linecap="round"/>
    <line x1="-35" y1="30" x2="35" y2="20" stroke="#451a03" stroke-width="8" stroke-linecap="round"/>
    <!-- Flames -->
    <polygon points="0,-40 18,10 6,15 0,5 -6,15 -18,10" fill="#facc15"/>
    <polygon points="0,-25 10,12 0,6 -10,12" fill="#f97316"/>
    <polygon points="0,-12 5,14 0,10 -5,14" fill="#ef4444"/>
    <!-- Embers -->
    <circle cx="-12" cy="-55" r="2" fill="#fef08a"/>
    <circle cx="8" cy="-65" r="1.5" fill="#f97316"/>
    <circle cx="16" cy="-45" r="2" fill="#facc15"/>
  </g>

  <!-- Atmospheric Text / Terminal Box -->
  <g transform="translate(400, 370)">
    <rect x="-160" y="-18" width="320" height="36" rx="4" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="0" y="5" fill="#a1a1aa" font-family="monospace" font-size="13" text-anchor="middle">
      &gt; the fire is dead. stoke fire.
    </text>
  </g>

  <!-- Title & Typography -->
  <g transform="translate(400, 95)">
    <rect x="-75" y="-30" width="150" height="24" rx="12" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
    <text x="0" y="-14" fill="#e4e4e7" font-family="system-ui, sans-serif" font-weight="800" font-size="11" text-anchor="middle" letter-spacing="2">TEXT RPG SURVIVAL</text>
    <text x="0" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="52" text-anchor="middle" letter-spacing="-1">
      A DARK <tspan fill="#f97316">ROOM</tspan>
    </text>
    <text x="0" y="55" fill="#71717a" font-family="system-ui, sans-serif" font-weight="600" font-size="13" text-anchor="middle">
      Doublespeak Games · Award-Winning Minimalist Text Odyssey
    </text>
  </g>
</svg>
