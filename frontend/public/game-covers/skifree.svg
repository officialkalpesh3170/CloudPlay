<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="snow-slope" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Snow Mountain Slope -->
  <rect width="800" height="450" fill="url(#snow-slope)"/>

  <!-- Pine Trees (Retro Windows Style) -->
  <g fill="#166534">
    <!-- Tree 1 -->
    <polygon points="180,240 210,160 240,240"/>
    <polygon points="190,200 210,130 230,200"/>
    <rect x="206" y="240" width="8" height="15" fill="#78350f"/>

    <!-- Tree 2 -->
    <polygon points="560,280 590,200 620,280"/>
    <polygon points="570,240 590,170 610,240"/>
    <rect x="586" y="280" width="8" height="15" fill="#78350f"/>

    <!-- Small tree -->
    <polygon points="340,360 360,310 380,360"/>
    <rect x="357" y="360" width="6" height="10" fill="#78350f"/>
  </g>

  <!-- Ski Tracks -->
  <path d="M 400 120 Q 370 200 420 280 T 390 420" fill="none" stroke="#cbd5e1" stroke-width="2.5"/>
  <path d="M 410 120 Q 380 200 430 280 T 400 420" fill="none" stroke="#cbd5e1" stroke-width="2.5"/>

  <!-- Pixel Skier Figure -->
  <g transform="translate(420, 260) scale(1.4)">
    <!-- Skis -->
    <line x1="-12" y1="20" x2="8" y2="35" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
    <line x1="-4" y1="18" x2="16" y2="33" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
    <!-- Body -->
    <rect x="-4" y="0" width="12" height="16" fill="#ef4444" rx="2"/>
    <!-- Head & Blue Toque -->
    <circle cx="2" cy="-6" r="6" fill="#fed7aa"/>
    <circle cx="2" cy="-9" r="5" fill="#3b82f6"/>
    <!-- Ski Poles -->
    <line x1="-8" y1="4" x2="-14" y2="24" stroke="#64748b" stroke-width="2"/>
    <line x1="8" y1="4" x2="18" y2="24" stroke="#64748b" stroke-width="2"/>
  </g>

  <!-- Distant Yeti / Abominable Snowman Hint -->
  <g transform="translate(640, 140) scale(0.9)" opacity="0.85">
    <ellipse cx="0" cy="0" rx="16" ry="24" fill="#94a3b8"/>
    <circle cx="0" cy="-22" r="12" fill="#94a3b8"/>
    <circle cx="-4" cy="-24" r="2" fill="#ef4444"/>
    <circle cx="4" cy="-24" r="2" fill="#ef4444"/>
  </g>

  <!-- Title & Typography -->
  <g transform="translate(400, 75)">
    <rect x="-70" y="-30" width="140" height="24" rx="12" fill="#0284c7" fill-opacity="0.12" stroke="#0284c7" stroke-width="1"/>
    <text x="0" y="-14" fill="#0284c7" font-family="system-ui, sans-serif" font-weight="800" font-size="11" text-anchor="middle" letter-spacing="2">DOWNHILL SLALOM</text>
    <text x="0" y="25" fill="#0f172a" font-family="system-ui, sans-serif" font-weight="900" font-size="52" text-anchor="middle" letter-spacing="-1">
      SKI<tspan fill="#ef4444">FREE</tspan>
    </text>
    <text x="0" y="55" fill="#475569" font-family="system-ui, sans-serif" font-weight="600" font-size="13" text-anchor="middle">
      Classic 90s Winter Slalom · Dodge Trees &amp; Escape the Yeti
    </text>
  </g>
</svg>
