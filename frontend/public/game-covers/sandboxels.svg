<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="sand-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#020204"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#sand-bg)"/>

  <!-- Pixelated Falling Sand Particle Simulation -->
  <g>
    <!-- Lava Flow -->
    <rect x="250" y="320" width="120" height="70" fill="#f97316"/>
    <rect x="260" y="300" width="100" height="30" fill="#ef4444"/>
    <rect x="270" y="310" width="80" height="20" fill="#fbbf24"/>

    <!-- Water Lake -->
    <rect x="380" y="330" width="160" height="60" fill="#0284c7"/>
    <rect x="390" y="320" width="140" height="20" fill="#38bdf8"/>

    <!-- Acid Basin -->
    <rect x="550" y="340" width="110" height="50" fill="#22c55e"/>

    <!-- Sand Dunes -->
    <polygon points="120,400 240,400 180,310" fill="#eab308"/>
    <polygon points="180,400 320,400 250,330" fill="#ca8a04"/>

    <!-- Falling Pixels Streams -->
    <g fill="#facc15">
      <rect x="280" y="140" width="6" height="6"/>
      <rect x="286" y="152" width="6" height="6"/>
      <rect x="274" y="164" width="6" height="6"/>
      <rect x="282" y="176" width="6" height="6"/>
      <rect x="288" y="190" width="6" height="6"/>
      <rect x="278" y="202" width="6" height="6"/>
      <rect x="284" y="220" width="6" height="6"/>
      <rect x="290" y="240" width="6" height="6"/>
    </g>

    <g fill="#38bdf8">
      <rect x="440" y="130" width="8" height="8"/>
      <rect x="448" y="150" width="8" height="8"/>
      <rect x="435" y="170" width="8" height="8"/>
      <rect x="442" y="195" width="8" height="8"/>
      <rect x="450" y="215" width="8" height="8"/>
      <rect x="438" y="245" width="8" height="8"/>
      <rect x="444" y="270" width="8" height="8"/>
    </g>

    <!-- Steam / Smoke Cloud -->
    <g fill="#94a3b8" opacity="0.3">
      <circle cx="370" cy="270" r="25"/>
      <circle cx="390" cy="250" r="35"/>
      <circle cx="360" cy="230" r="20"/>
    </g>
  </g>

  <!-- Title & Typography -->
  <g transform="translate(400, 75)">
    <rect x="-80" y="-30" width="160" height="24" rx="12" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-width="1"/>
    <text x="0" y="-14" fill="#4ade80" font-family="system-ui, sans-serif" font-weight="800" font-size="11" text-anchor="middle" letter-spacing="2">FALLING SAND SIMULATOR</text>
    <text x="0" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="50" text-anchor="middle" letter-spacing="-1">
      SANDBOX<tspan fill="#4ade80">ELS</tspan>
    </text>
    <text x="0" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="600" font-size="13" text-anchor="middle">
      500+ Elements · Heat, Electricity, Gravity &amp; Chemical Reactions
    </text>
  </g>
</svg>
