<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="hc-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="hc-grass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="15%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="hc-coin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="450" fill="url(#hc-sky)"/>

  <!-- Sun -->
  <circle cx="700" cy="90" r="50" fill="#fef08a" opacity="0.9"/>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="140" cy="110" rx="70" ry="25"/>
    <ellipse cx="180" cy="95" rx="50" ry="30"/>
    <ellipse cx="480" cy="130" rx="90" ry="28"/>
    <ellipse cx="520" cy="110" rx="55" ry="32"/>
  </g>

  <!-- Steep Rolling Mountain Terrain -->
  <path d="M 0 450 L 0 320 Q 200 340 340 260 T 620 180 Q 720 140 800 170 L 800 450 Z" fill="url(#hc-grass)"/>
  <path d="M 0 320 Q 200 340 340 260 T 620 180 Q 720 140 800 170" fill="none" stroke="#4ade80" stroke-width="12" stroke-linecap="round"/>

  <!-- Floating Gold Coins -->
  <g transform="translate(560, 130)">
    <circle cx="0" cy="0" r="18" fill="url(#hc-coin)" stroke="#854d0e" stroke-width="2"/>
    <circle cx="0" cy="0" r="13" fill="none" stroke="#fef08a" stroke-width="1.5"/>
    <text x="0" y="6" fill="#854d0e" font-family="system-ui, sans-serif" font-weight="900" font-size="16" text-anchor="middle">$</text>
  </g>
  <g transform="translate(620, 105)">
    <circle cx="0" cy="0" r="18" fill="url(#hc-coin)" stroke="#854d0e" stroke-width="2"/>
    <circle cx="0" cy="0" r="13" fill="none" stroke="#fef08a" stroke-width="1.5"/>
    <text x="0" y="6" fill="#854d0e" font-family="system-ui, sans-serif" font-weight="900" font-size="16" text-anchor="middle">$</text>
  </g>

  <!-- Red Fuel Jerry Can -->
  <g transform="translate(690, 85) rotate(15)">
    <rect x="-12" y="-16" width="24" height="32" rx="4" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
    <rect x="-4" y="-22" width="8" height="6" rx="2" fill="#991b1b"/>
    <text x="0" y="5" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="10" text-anchor="middle">GAS</text>
  </g>

  <!-- Classic Red Hill Climb Racing Jeep -->
  <g transform="translate(380, 220) rotate(-18) scale(1.35)">
    <!-- Rear Wheel -->
    <g transform="translate(-40, 24)">
      <circle cx="0" cy="0" r="22" fill="#18181b" stroke="#3f3f46" stroke-width="3"/>
      <circle cx="0" cy="0" r="11" fill="#71717a"/>
      <!-- Treads -->
      <line x1="-22" y1="0" x2="-16" y2="0" stroke="#52525b" stroke-width="4"/>
      <line x1="16" y1="0" x2="22" y2="0" stroke="#52525b" stroke-width="4"/>
      <line x1="0" y1="-22" x2="0" y2="-16" stroke="#52525b" stroke-width="4"/>
      <line x1="0" y1="16" x2="0" y2="22" stroke="#52525b" stroke-width="4"/>
    </g>

    <!-- Front Wheel -->
    <g transform="translate(42, 24)">
      <circle cx="0" cy="0" r="22" fill="#18181b" stroke="#3f3f46" stroke-width="3"/>
      <circle cx="0" cy="0" r="11" fill="#71717a"/>
      <line x1="-22" y1="0" x2="-16" y2="0" stroke="#52525b" stroke-width="4"/>
      <line x1="16" y1="0" x2="22" y2="0" stroke="#52525b" stroke-width="4"/>
      <line x1="0" y1="-22" x2="0" y2="-16" stroke="#52525b" stroke-width="4"/>
      <line x1="0" y1="16" x2="0" y2="22" stroke="#52525b" stroke-width="4"/>
    </g>

    <!-- Suspension Struts -->
    <line x1="-40" y1="5" x2="-40" y2="22" stroke="#1e293b" stroke-width="5"/>
    <line x1="42" y1="5" x2="42" y2="22" stroke="#1e293b" stroke-width="5"/>

    <!-- Red Jeep Body -->
    <polygon points="-52,5 55,5 45,-15 15,-15 -10,-15 -52,5" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
    <rect x="-48" y="-5" width="98" height="10" fill="#ef4444"/>

    <!-- Roll Cage Bar -->
    <polyline points="-30,5 -25,-35 -8,-35 -8,5" fill="none" stroke="#18181b" stroke-width="4.5"/>

    <!-- Windshield -->
    <line x1="16" y1="5" x2="28" y2="-28" stroke="#334155" stroke-width="4"/>
    <polygon points="16,5 28,-28 26,-28 14,5" fill="#bae6fd" opacity="0.6"/>

    <!-- Driver (Bill Newton) -->
    <g transform="translate(-10, -10)">
      <!-- Torso -->
      <rect x="-8" y="-12" width="16" height="18" rx="3" fill="#dc2626"/>
      <!-- Steering Wheel -->
      <circle cx="12" cy="-6" r="7" fill="none" stroke="#18181b" stroke-width="3"/>
      <!-- Head -->
      <circle cx="0" cy="-22" r="9" fill="#fed7aa"/>
      <circle cx="3" cy="-23" r="2" fill="#0f172a"/>
      <!-- Blue Baseball Cap -->
      <path d="M -9 -24 Q 0 -34 9 -24 Z" fill="#2563eb"/>
      <rect x="0" y="-24" width="14" height="3" rx="1.5" fill="#1d4ed8"/>
    </g>

    <!-- Headlight Beam -->
    <circle cx="54" cy="-5" r="5" fill="#fef08a"/>
    <polygon points="58,-7 140,-25 140,15 58,-3" fill="#fef08a" opacity="0.25"/>
  </g>

  <!-- Title & Typography Banner -->
  <g transform="translate(240, 75)">
    <rect x="-10" y="-30" width="160" height="24" rx="12" fill="#0f172a" fill-opacity="0.6"/>
    <text x="70" y="-14" fill="#4ade80" font-family="system-ui, sans-serif" font-weight="800" font-size="11" text-anchor="middle" letter-spacing="2">PHYSICS OFFROAD</text>
    <text x="0" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="50" letter-spacing="-1" stroke="#0f172a" stroke-width="5" paint-order="stroke fill">
      HILL CLIMB <tspan fill="#ef4444">RACING</tspan>
    </text>
  </g>
</svg>
