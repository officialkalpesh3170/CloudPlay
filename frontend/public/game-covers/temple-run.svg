<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="tr-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#04000a"/>
      <stop offset="50%" stop-color="#12002b"/>
      <stop offset="100%" stop-color="#060014"/>
    </linearGradient>
    <linearGradient id="track-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#240046"/>
      <stop offset="100%" stop-color="#5a189a"/>
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#tr-bg)"/>

  <!-- Tunnel Perspective Lines -->
  <g stroke="#7b2cbf" stroke-width="1.5" opacity="0.4">
    <!-- Tunnel Ceiling & Walls -->
    <line x1="400" y1="140" x2="0" y2="0"/>
    <line x1="400" y1="140" x2="200" y2="0"/>
    <line x1="400" y1="140" x2="600" y2="0"/>
    <line x1="400" y1="140" x2="800" y2="0"/>
    <line x1="400" y1="140" x2="0" y2="200"/>
    <line x1="400" y1="140" x2="800" y2="200"/>

    <!-- Concentric Perspective Arches -->
    <rect x="350" y="110" width="100" height="80" fill="none" stroke="#9d4edd" stroke-width="1" opacity="0.3"/>
    <rect x="280" y="70" width="240" height="180" fill="none" stroke="#9d4edd" stroke-width="1.5" opacity="0.5"/>
    <rect x="180" y="20" width="440" height="320" fill="none" stroke="#c77dff" stroke-width="2" opacity="0.6"/>
    <rect x="50" y="-30" width="700" height="480" fill="none" stroke="#e0aaff" stroke-width="2.5" opacity="0.7"/>
  </g>

  <!-- 3-Lane Neon Running Track -->
  <polygon points="400,150 180,450 620,450" fill="url(#track-grad)" stroke="#c77dff" stroke-width="2"/>
  
  <!-- Lane Divider Lines -->
  <line x1="400" y1="150" x2="326" y2="450" stroke="#00e5ff" stroke-width="2.5" stroke-dasharray="14 10" filter="url(#neon-glow)"/>
  <line x1="400" y1="150" x2="474" y2="450" stroke="#00e5ff" stroke-width="2.5" stroke-dasharray="14 10" filter="url(#neon-glow)"/>

  <!-- Rotating Gold Coin Clusters -->
  <g transform="translate(340, 310)">
    <circle cx="0" cy="0" r="14" fill="#facc15" stroke="#ca8a04" stroke-width="2" filter="url(#neon-glow)"/>
    <text x="0" y="5" fill="#78350f" font-family="system-ui, sans-serif" font-weight="900" font-size="12" text-anchor="middle">♦</text>
  </g>
  <g transform="translate(460, 260)">
    <circle cx="0" cy="0" r="10" fill="#facc15" stroke="#ca8a04" stroke-width="1.5" filter="url(#neon-glow)"/>
  </g>

  <!-- Neon Runner Silhouette (Center Lane) -->
  <g transform="translate(400, 350) scale(1.6)" filter="url(#neon-glow)">
    <!-- Motion Speed Streaks -->
    <line x1="-12" y1="10" x2="-25" y2="22" stroke="#00e5ff" stroke-width="2" opacity="0.8"/>
    <line x1="12" y1="10" x2="25" y2="22" stroke="#00e5ff" stroke-width="2" opacity="0.8"/>
    
    <!-- Body -->
    <rect x="-4" y="-18" width="8" height="18" rx="2" fill="#00e5ff"/>
    <!-- Head -->
    <circle cx="0" cy="-24" r="6" fill="#00e5ff"/>
    <!-- Running Arms -->
    <line x1="-4" y1="-14" x2="-14" y2="-6" stroke="#00e5ff" stroke-width="3" stroke-linecap="round"/>
    <line x1="4" y1="-14" x2="14" y2="-20" stroke="#00e5ff" stroke-width="3" stroke-linecap="round"/>
    <!-- Running Legs -->
    <line x1="-3" y1="0" x2="-10" y2="18" stroke="#00e5ff" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="3" y1="0" x2="12" y2="14" stroke="#00e5ff" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Title & Typography Banner -->
  <g transform="translate(400, 70)">
    <rect x="-85" y="-30" width="170" height="24" rx="12" fill="#00e5ff" fill-opacity="0.15" stroke="#00e5ff" stroke-width="1"/>
    <text x="0" y="-14" fill="#00e5ff" font-family="system-ui, sans-serif" font-weight="800" font-size="11" text-anchor="middle" letter-spacing="2">3D ENDLESS RUNNER</text>
    <text x="0" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="52" text-anchor="middle" letter-spacing="-1">
      TEMPLE <tspan fill="#00e5ff">RUN</tspan>
    </text>
    <text x="0" y="58" fill="#e0aaff" font-family="system-ui, sans-serif" font-weight="600" font-size="13" text-anchor="middle">
      GameHelix · Neon 3D Perspective Endless Runner · 100% Client-Side
    </text>
  </g>
</svg>
