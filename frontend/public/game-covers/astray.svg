<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="maze-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <radialGradient id="sphere-glow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#082f49"/>
    </radialGradient>
    <filter id="maze-bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#maze-bg)"/>

  <!-- Isometric 3D Maze Walls -->
  <g transform="translate(400, 260) scale(1.1)">
    <!-- Maze Floor Grid -->
    <polygon points="0,-100 180,0 0,100 -180,0" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>

    <!-- Left Wall Pillars -->
    <polygon points="-120,-30 -80,-52 -80,-10 -120,12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <polygon points="-80,-52 -40,-30 -40,12 -80,-10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

    <!-- Right Wall Pillars -->
    <polygon points="40,-30 80,-52 80,-10 40,12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <polygon points="80,-52 120,-30 120,12 80,-10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

    <!-- Glowing Rolling Marble Sphere -->
    <circle cx="0" cy="5" r="32" fill="url(#sphere-glow)" stroke="#00f0ff" stroke-width="2" filter="url(#maze-bloom)"/>
    <ellipse cx="0" cy="40" rx="26" ry="8" fill="#000000" opacity="0.6"/>
  </g>

  <!-- Title & Typography -->
  <g transform="translate(400, 75)">
    <rect x="-70" y="-30" width="140" height="24" rx="12" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" stroke-width="1"/>
    <text x="0" y="-14" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="800" font-size="11" text-anchor="middle" letter-spacing="2">3D WEBGL MAZE</text>
    <text x="0" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="52" text-anchor="middle" letter-spacing="-1">
      AS<tspan fill="#38bdf8">TRAY</tspan>
    </text>
    <text x="0" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="600" font-size="13" text-anchor="middle">
      Three.js &amp; Box2D WebGL Marble Maze Simulation
    </text>
  </g>
</svg>
