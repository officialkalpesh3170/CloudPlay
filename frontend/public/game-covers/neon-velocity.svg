<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050714"/>
      <stop offset="50%" stop-color="#0c1228"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>
    <linearGradient id="glow-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="glow-magenta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Neon Cyberpunk City Skyline in Horizon -->
  <g opacity="0.35">
    <rect x="80" y="140" width="45" height="110" fill="#0f172a" stroke="#00f0ff" stroke-width="0.7"/>
    <rect x="135" y="110" width="60" height="140" fill="#0f172a" stroke="#ec4899" stroke-width="0.7"/>
    <rect x="205" y="150" width="35" height="100" fill="#0f172a" stroke="#00f0ff" stroke-width="0.7"/>
    <rect x="560" y="130" width="50" height="120" fill="#0f172a" stroke="#ec4899" stroke-width="0.7"/>
    <rect x="620" y="100" width="65" height="150" fill="#0f172a" stroke="#00f0ff" stroke-width="0.7"/>
    <rect x="695" y="145" width="40" height="105" fill="#0f172a" stroke="#ec4899" stroke-width="0.7"/>
  </g>

  <!-- Perspective Highway Grid -->
  <g stroke="#00f0ff" stroke-width="1.8" opacity="0.4">
    <line x1="400" y1="210" x2="0" y2="450"/>
    <line x1="400" y1="210" x2="140" y2="450"/>
    <line x1="400" y1="210" x2="280" y2="450"/>
    <line x1="400" y1="210" x2="400" y2="450" stroke="#facc15" stroke-dasharray="16 12" stroke-width="2.5"/>
    <line x1="400" y1="210" x2="520" y2="450"/>
    <line x1="400" y1="210" x2="660" y2="450"/>
    <line x1="400" y1="210" x2="800" y2="450"/>

    <line x1="320" y1="240" x2="480" y2="240" stroke="#ec4899" opacity="0.5"/>
    <line x1="240" y1="280" x2="560" y2="280" stroke="#ec4899" opacity="0.5"/>
    <line x1="140" y1="340" x2="660" y2="340" stroke="#ec4899" opacity="0.5"/>
    <line x1="30" y1="410" x2="770" y2="410" stroke="#ec4899" opacity="0.5"/>
  </g>

  <!-- Cyberpunk Supercar Rear Silhouette -->
  <g transform="translate(400, 310)" filter="url(#neon)">
    <!-- Exhaust Nitro Flame -->
    <polygon points="-18,22 -22,48 -14,22" fill="#00f0ff" opacity="0.9"/>
    <polygon points="18,22 22,48 14,22" fill="#00f0ff" opacity="0.9"/>
    <polygon points="-3,24 0,55 3,24" fill="#f43f5e" opacity="0.95"/>

    <!-- Wide Racing Wheels -->
    <rect x="-65" y="-5" width="22" height="34" rx="4" fill="#020617" stroke="#00f0ff" stroke-width="1.5"/>
    <rect x="43" y="-5" width="22" height="34" rx="4" fill="#020617" stroke="#00f0ff" stroke-width="1.5"/>

    <!-- Car Body -->
    <polygon points="-52,18 52,18 44,-22 28,-36 -28,-36 -44,-22" fill="#0f172a" stroke="url(#glow-cyan)" stroke-width="2.5"/>
    <!-- Cockpit Canopy -->
    <polygon points="-24,-24 24,-24 16,-46 -16,-46" fill="#00e5ff" opacity="0.75" stroke="#fff" stroke-width="1"/>

    <!-- Neon Lightbar Tail Lights -->
    <line x1="-42" y1="5" x2="42" y2="5" stroke="#f43f5e" stroke-width="4"/>
    <line x1="-48" y1="-8" x2="-28" y2="-8" stroke="#00f0ff" stroke-width="2"/>
    <line x1="28" y1="-8" x2="48" y2="-8" stroke="#00f0ff" stroke-width="2"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(400, 85)" text-anchor="middle">
    <text font-family="'Inter', system-ui, sans-serif" font-weight="900" font-size="38" fill="#ffffff" letter-spacing="3" filter="url(#neon)">
      NEON VELOCITY
    </text>
    <text y="32" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="14" fill="#00f0ff" letter-spacing="6">
      CYBER HIGHWAY 3D
    </text>
  </g>
</svg>
