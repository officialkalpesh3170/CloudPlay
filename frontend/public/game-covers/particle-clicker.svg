<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="cern-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050510"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="beam-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <filter id="particle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#cern-bg)"/>

  <!-- Collider Rings -->
  <g transform="translate(400, 225)" filter="url(#particle-glow)">
    <circle cx="0" cy="0" r="160" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="8 12" opacity="0.4"/>
    <circle cx="0" cy="0" r="120" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="16 8" opacity="0.6"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#ec4899" stroke-width="3" stroke-dasharray="6 6" opacity="0.8"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#00f0ff" stroke-width="3" opacity="0.9"/>
    
    <!-- Central Collision Point -->
    <circle cx="0" cy="0" r="18" fill="#ffffff"/>
    <circle cx="0" cy="0" r="28" fill="#00f0ff" opacity="0.4"/>

    <!-- Particle Trajectories -->
    <path d="M 0 0 Q 80 -60 180 -30" fill="none" stroke="#facc15" stroke-width="2.5"/>
    <path d="M 0 0 Q -100 80 -170 120" fill="none" stroke="#00f0ff" stroke-width="2.5"/>
    <path d="M 0 0 Q -60 -120 -120 -180" fill="none" stroke="#ec4899" stroke-width="2"/>
    <path d="M 0 0 Q 120 70 200 130" fill="none" stroke="#a855f7" stroke-width="2"/>
  </g>

  <!-- Title & Typography -->
  <g transform="translate(400, 75)">
    <rect x="-85" y="-30" width="170" height="24" rx="12" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="1"/>
    <text x="0" y="-14" fill="#c084fc" font-family="system-ui, sans-serif" font-weight="800" font-size="11" text-anchor="middle" letter-spacing="2">CERN RESEARCH LAB</text>
    <text x="0" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="46" text-anchor="middle" letter-spacing="-1">
      PARTICLE <tspan fill="#ec4899">CLICKER</tspan>
    </text>
    <text x="0" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="600" font-size="13" text-anchor="middle">
      Discover the Higgs Boson · Upgrade Colliders &amp; Detectors
    </text>
  </g>
</svg>
