<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="50%" stop-color="#0a122c"/>
      <stop offset="100%" stop-color="#020409"/>
    </linearGradient>
    <linearGradient id="glow-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="glow-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="100%" stop-color="#ff7700"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Perspective Speed Track Grid -->
  <g stroke="#00f0ff" stroke-width="1.5" opacity="0.3">
    <line x1="400" y1="180" x2="0" y2="450"/>
    <line x1="400" y1="180" x2="150" y2="450"/>
    <line x1="400" y1="180" x2="300" y2="450"/>
    <line x1="400" y1="180" x2="400" y2="450"/>
    <line x1="400" y1="180" x2="500" y2="450"/>
    <line x1="400" y1="180" x2="650" y2="450"/>
    <line x1="400" y1="180" x2="800" y2="450"/>

    <ellipse cx="400" cy="220" rx="60" ry="10" fill="none"/>
    <ellipse cx="400" cy="270" rx="140" ry="24" fill="none"/>
    <ellipse cx="400" cy="340" rx="260" ry="45" fill="none"/>
    <ellipse cx="400" cy="420" rx="420" ry="70" fill="none"/>
  </g>

  <!-- Futuristic Wipeout Craft Silhouette -->
  <g transform="translate(400, 260) scale(1.4)" filter="url(#neon)">
    <!-- Jet Thruster Trails -->
    <polygon points="-40,15 -12,20 -15,50" fill="#00f0ff" opacity="0.8"/>
    <polygon points="40,15 12,20 15,50" fill="#00f0ff" opacity="0.8"/>
    <polygon points="-5,18 5,18 0,65" fill="#ff7700" opacity="0.9"/>

    <!-- Main Craft Hull -->
    <polygon points="0,-45 28,15 16,22 0,16 -16,22 -28,15" fill="#1e293b" stroke="#00f0ff" stroke-width="2"/>
    <!-- Left Wing -->
    <polygon points="-28,15 -75,25 -55,0 -20,-10" fill="#0f172a" stroke="#00f0ff" stroke-width="1.5"/>
    <!-- Right Wing -->
    <polygon points="28,15 75,25 55,0 20,-10" fill="#0f172a" stroke="#00f0ff" stroke-width="1.5"/>
    <!-- Cockpit Canopy -->
    <polygon points="0,-25 8,-5 0,2 -8,-5" fill="#00f0ff" opacity="0.9"/>
  </g>

  <!-- Title & Badge -->
  <g transform="translate(400, 80)">
    <rect x="-80" y="-30" width="160" height="24" rx="12" fill="#00f0ff" fill-opacity="0.12" stroke="#00f0ff" stroke-width="1"/>
    <text x="0" y="-14" fill="#00f0ff" font-family="system-ui, sans-serif" font-weight="800" font-size="11" text-anchor="middle" letter-spacing="2">3D SCI-FI RACING</text>
    <text x="0" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="54" text-anchor="middle" letter-spacing="-1">
      HEX<tspan fill="#00f0ff">GL</tspan>
    </text>
    <text x="0" y="55" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="600" font-size="14" text-anchor="middle" letter-spacing="1">
      BKcore · Futuristic WebGL Anti-Gravity Speed
    </text>
  </g>
</svg>
