services:

  backend:
    image: cloudplay-backend:v1
    container_name: cloudplay-backend
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /root/.config/gcloud/application_default_credentials.json
    volumes:
      - type: bind
        source: ${APPDATA}/gcloud/application_default_credentials.json
        target: /root/.config/gcloud/application_default_credentials.json
        read_only: true
    expose:
      - "8000"
    networks:
      - cloudplay-network

  frontend:
    image: cloudplay-frontend:v1
    container_name: cloudplay-frontend
    ports:
      - "3000:8080"
    depends_on:
      - backend
    networks:
      - cloudplay-network

networks:
  cloudplay-network:
    driver: bridge
